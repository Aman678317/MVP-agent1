services:
  - type: web
    name: ai-marketing-saas-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: web: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: "10000"
      - key: GEMINI_API_KEY
        value: "${{ secrets.GEMINI_API_KEY }}"
      - key: RAZORPAY_KEY_ID
        value: "${{ secrets.RAZORPAY_KEY_ID }}"
      - key: RAZORPAY_KEY_SECRET
        value: "${{ secrets.RAZORPAY_KEY_SECRET }}"
      - key: SMTP_SERVER
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_EMAIL
        value: "${{ secrets.SMTP_EMAIL }}"
      - key: SMTP_PASSWORD
        value: "${{ secrets.SMTP_PASSWORD }}"
      - key: TWILIO_ACCOUNT_SID
        value: "${{ secrets.TWILIO_ACCOUNT_SID }}"
      - key: TWILIO_AUTH_TOKEN
        value: "${{ secrets.TWILIO_AUTH_TOKEN }}"
      - key: TWILIO_PHONE_NUMBER
        value: "${{ secrets.TWILIO_PHONE_NUMBER }}"
      - key: FIREBASE_CREDENTIALS
        value: "${{ secrets.FIREBASE_CREDENTIALS }}"
      - key: FRONTEND_URL
        value: "https://mvp-agent1.vercel.app"
